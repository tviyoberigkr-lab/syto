# Syto — автоматичне оновлення новин і публікація сайту. CoLaba Production
name: Оновлення новин

on:
  schedule:
    # З 22.11 випуски запускає cron-job.org (акаунт Романа) о 07:50, 11:50, 15:50 і 19:50 за Києвом —
    # через workflow_dispatch з ключем, що вміє лише запускати це оновлення.
    # Розклад GitHub лишено ОДНИМ рядком як запасний: якщо cron-job.org не спрацює, GitHub
    # спробує ще раз (час у UTC). Якщо свіжий випуск уже є (молодший за 50 хв), спроба одразу завершується.
    # Причина переходу: 20–22.11 GitHub пропускав або запізнювався із запусками на години.
    - cron: '17 6,10,14,18 * * *'
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуску
  push:
    branches: [main]

# Права — мінімальні й окремо для кожного завдання (аудит безпеки 21.11).
permissions: {}

concurrency:
  group: syto-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write   # лише щоб зберегти кеш перекладів у репозиторій
    outputs:
      skip: ${{ steps.fresh.outputs.skip }}
    steps:
      # Лише для запусків за розкладом: якщо попередня спроба вже зробила свіжий випуск — зупиняємось.
      # Ручні запуски й зміни коду збираються завжди. Якщо сайт не відповів — збираємо (краще зайвий випуск, ніж пропущений).
      - name: Чи потрібен цей випуск
        id: fresh
        run: |
          skip=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            gen=$(curl -fsS --max-time 20 "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/data/news.json" \
                  | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{try{console.log(Date.parse(JSON.parse(d).generatedAt)||0)}catch{console.log(0)}})" || echo 0)
            age=$(( ( $(date +%s%3N) - gen ) / 60000 ))
            if [ "$gen" = "0" ]; then echo "Не вдалося прочитати попередній випуск — збираємо."; else echo "Попередній випуск: $age хв тому"; fi
            if [ "$gen" != "0" ] && [ "$age" -ge 0 ] && [ "$age" -lt 50 ]; then skip=true; echo "Свіжий випуск уже є — цю спробу пропускаємо."; fi
          fi
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        if: steps.fresh.outputs.skip != 'true'
      - uses: actions/setup-node@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts   # сторонні пакети не виконують свій код під час встановлення
        if: steps.fresh.outputs.skip != 'true'
      # Сховище повідомлень за 48 год живе в кеші Actions (не в історії репозиторію).
      - uses: actions/cache@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          path: data/items.json
          key: syto-items-${{ github.run_id }}
          restore-keys: syto-items-
      - name: Перевірка коду
        if: steps.fresh.outputs.skip != 'true'
        run: npm test
      - name: Збір і просіювання новин
        if: steps.fresh.outputs.skip != 'true'
        run: node pipeline/build.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TRANSLATE_MODEL: ${{ vars.TRANSLATE_MODEL || 'claude-sonnet-5-5' }}   # 22.11: Sonnet 5.5 за рішенням Романа (платиться з подарункових кредитів)
          # Щоб зупинити нові переклади (витрати), постав тут '0': уже перекладене береться з кешу безкоштовно.
          TRANSLATE_MAX_NEW: ${{ vars.TRANSLATE_MAX_NEW }}
          # Рубрики українських заголовків (25.11): дешева модель; '0' у CLASSIFY_MAX_NEW зупиняє нові платні запити (кеш працює).
          CLASSIFY_MODEL: ${{ vars.CLASSIFY_MODEL || 'claude-haiku-5-5' }}
          CLASSIFY_MAX_NEW: ${{ vars.CLASSIFY_MAX_NEW }}
      - name: Зберегти кеш перекладів і рубрик
        if: steps.fresh.outputs.skip != 'true'
        run: |
          date -u +%F > data/heartbeat.txt
          git config user.name "syto-bot"
          git config user.email "syto-bot@users.noreply.github.com"
          git add data/translations.json data/classes.json data/heartbeat.txt
          git diff --cached --quiet || (git commit -m "дані: кеш перекладів і рубрик [skip ci]" && git push)
      - uses: actions/configure-pages@v5
        if: steps.fresh.outputs.skip != 'true'
      - uses: actions/upload-pages-artifact@v4
        if: steps.fresh.outputs.skip != 'true'
        with:
          path: site

  # Публікація — окремим завданням після збірки (так радить документація GitHub):
  # 20.11 публікація в тому ж завданні не побачила щойно завантажений архів сайту.
  deploy:
    needs: build
    if: needs.build.outputs.skip != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write      # публікація сайту
      id-token: write   # підтвердження, що публікує саме цей репозиторій
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
